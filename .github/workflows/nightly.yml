name: Nightly source check
# Candidates edit their sites. Every night, re-fetch every published source and
# confirm each quote is still there. If one disappears, open an issue so the
# claim gets rechecked instead of silently going stale.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sources:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y -qq poppler-utils
      - name: Re-verify every quote
        id: check
        run: |
          set +e
          npm run check:research > check.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat check.txt
      # Some sites show GitHub's servers a different page than a browser gets, so a miss
      # here isn't proof. Keep one running issue (updated nightly) for a maintainer to
      # recheck from a normal connection, instead of a new issue every night.
      - name: Update the source-check issue if any quote went missing
        if: steps.check.outputs.status != '0'
        run: |
          { echo "The nightly check (run $(date -u +%Y-%m-%d)) couldn't find these quotes on their source pages. Some sites show GitHub's servers a different page, so a maintainer rechecks from a normal connection (\`npm run check:research -- <files>\`) before changing anything."; echo; echo '```'; grep -E '✗' check.txt; echo '```'; } > body.md
          N=$(gh issue list --label source-check --state open --json number -q '.[0].number')
          if [ -n "$N" ]; then gh issue edit "$N" --body-file body.md; else gh issue create --title "Source check: quotes to recheck" --body-file body.md --label source-check; fi
