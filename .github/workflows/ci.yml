name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y -qq poppler-utils
      - run: npm run typecheck
      - run: npm test
      - name: Research file schema is up to date
        run: npm run schema && git diff --exit-code data/positions.schema.json
      - name: Every file is valid
        run: npm run check:research -- --offline
      # Research pushed by maintainers was verified when it was written (some sites show
      # GitHub's servers a different page, so rechecking here gives false alarms).
      # Contributors' pull requests are checked online, for the files they change.
      - name: Quotes in changed files are on their source pages (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only --diff-filter=AM "${{ github.event.pull_request.base.sha }}" HEAD -- data/positions | grep '\.json$' || true)
          if [ -n "$CHANGED" ]; then npm run check:research -- $CHANGED; fi
