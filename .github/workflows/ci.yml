name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y -qq poppler-utils
      - run: npm run typecheck
      - run: npm test
      - name: Research file schema is up to date
        run: npm run schema && git diff --exit-code data/positions.schema.json
      - name: Every file is valid, and quotes in changed files are on their source pages
        run: |
          BASE=${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGED=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- data/positions | grep '\.json$' || true)
          if [ -n "$CHANGED" ]; then npm run check:research -- $CHANGED; else npm run check:research -- --offline; fi
