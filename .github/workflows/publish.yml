name: Publish the API
# Every push to main that changes the data or the build rebuilds the free static API and publishes it to GitHub Pages:
# https://n8peace.github.io/open-election-data/
on:
  push:
    branches: [main]
    # Only what the API is built from. Docs-only pushes skip the rebuild.
    paths:
      - 'data/**'
      - 'lib/**'
      - 'scripts/**'
      - 'site/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:research -- --offline
      - run: npm run build:api
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
